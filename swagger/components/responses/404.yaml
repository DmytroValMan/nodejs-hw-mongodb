description: Not Found error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Contact not found
        data:
          type: object
          required:
            - status
            - message
            - name
            - expose
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            name:
              type: string
              example: NotFoundError
            expose:
              type: boolean
              example: true
