type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 6882511ee937211982457993
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380000000002'
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    default: 'personal'
  userId:
    description: "Contact's user's id"
    type: string
    example: 6881e57e062417f793bc8337
  email:
    description: "Contact's email"
    type: string
    example: 'vasyl9@example.com'
  isFavourite:
    description: "Contact's belonging to favourites"
    type: boolean
    default: false
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
